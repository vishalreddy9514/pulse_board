name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (lint, unit, integration, build)
    runs-on: ubuntu-latest

    # The integration suite talks to a real Postgres and a real Redis; that is
    # the point of it, so CI provides them rather than mocking them out.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulseboard
          POSTGRES_PASSWORD: pulseboard
          POSTGRES_DB: pulseboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pulseboard -d pulseboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pulseboard:pulseboard@localhost:5432/pulseboard
      REDIS_URL: redis://localhost:6379
      REDIS_EVENT_CHANNEL: pulseboard:events
      JWT_SECRET: ci-secret-not-used-anywhere-real
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Integration tests (real Redis, Postgres and WebSocket)
        working-directory: backend
        run: npm run test:integration

      - name: Build
        working-directory: backend
        run: npm run build

  producer:
    name: Producer (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: producer/package-lock.json

      - name: Install dependencies
        working-directory: producer
        run: npm ci

      - name: Lint
        working-directory: producer
        run: npm run lint

      - name: Unit tests
        working-directory: producer
        run: npm test

      - name: Build
        working-directory: producer
        run: npm run build

  frontend:
    name: Frontend (lint, component tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Component tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  images:
    name: Container images build
    runs-on: ubuntu-latest
    # Only worth the minutes once the code itself is known good.
    needs: [backend, producer, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build producer image
        uses: docker/build-push-action@v6
        with:
          context: ./producer
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
